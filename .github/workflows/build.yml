name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

      # One self-contained .exe that runs without installing .NET
      - name: Publish
        run: dotnet publish DualSenseCompanion -c Release -p:SingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: DualSenseCompanion
          path: publish/DualSenseCompanion.exe
          if-no-files-found: error

  # Pushing a tag like v1.1.0 creates a GitHub release with the .exe attached
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DualSenseCompanion
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/DualSenseCompanion.exe
          generate_release_notes: true
